version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villaplaza-web
    restart: always
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.villaplaza-router.rule=Host(`villaplaza.suporteide.digital`)"
      - "traefik.http.routers.villaplaza-router.entrypoints=websecure"
      - "traefik.http.routers.villaplaza-router.tls=true"
      - "traefik.http.routers.villaplaza-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.villaplaza-service.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
